<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <style>
        body {
            background: #b8cbe6;
            font-size: 13px;
        }

        .main-box {
            background: #d7e5fb;
            border: 1px solid #8fa7c9;
            padding: 10px;
        }

        .toolbar {
            background: #e7f0ff;
            border: 1px solid #9fb5d9;
            padding: 8px;
            margin-bottom: 10px;
        }

        .left-panel {
            background: #fff;
            border: 1px solid #9fb5d9;
            height: 560px;
        }

        .form-panel {
            background: #eaf2ff;
            border: 1px solid #9fb5d9;
            padding: 10px;
        }

        .tab-content {
            background: #eaf2ff;
            border: 1px solid #9fb5d9;
            padding: 10px;
        }

        input,
        select {
            height: 26px !important;
            font-size: 13px !important;
        }

        .photo-box {
            height: 140px;
            border: 1px solid #999;
            background: #fff;
        }
    </style>
</head>

<body>



    <div class="container-fluid mt-3">

        <div class="main-box">

            <!-- TOOLBAR -->
            <div class="toolbar">
                <button class="btn btn-light btn-sm">New</button>
                <button class="btn btn-primary btn-sm">Save</button>
                <button class="btn btn-secondary btn-sm">Cancel</button>
                <button class="btn btn-danger btn-sm">Delete</button>
            </div>


            <div class="row">

                <!-- LEFT EMPLOYEE LIST -->
                <div class="col-md-3">

                    <div class="left-panel p-2">

                        <table class="table table-sm">
                            <thead>
                                <tr>
                                    <th>S.N.</th>
                                    <th>Emp No.</th>
                                    <th>Name</th>
                                </tr>
                            </thead>
                        </table>

                    </div>

                </div>


                <!-- RIGHT FORM -->
                <div class="col-md-9">

                    <div class="form-panel">

                        <!-- TOP EMPLOYEE INFO -->

                        <div class="row mb-2">

                            <div class="col-md-3">
                                <label>ID NO :</label>
                                <input class="form-control" value="EM00001">
                            </div>

                            <div class="col-md-3">
                                <label>Status :</label>
                                <select class="form-select">
                                    <option>Temporary</option>
                                    <option>Permanent</option>
                                </select>
                            </div>

                            <div class="col-md-3">
                                <label>Appointment Date :</label>
                                <input type="text" class="form-control">
                            </div>

                            <div class="col-md-3">
                                <label>Entry Date :</label>
                                <input type="text" class="form-control">
                            </div>

                        </div>


                        <div class="row mb-3">

                            <div class="col-md-4">
                                <label>Designation :</label>
                                <select class="form-select">
                                    <option value="">-- Select Designation --</option>
                                    <option value="chairman">Chairman</option>
                                    <option value="vice_chairman">Vice Chairman</option>
                                    <option value="manager">Manager</option>
                                    <option value="accountant">Accountant</option>
                                    <option value="cashier">Cashier</option>
                                    <option value="loan_officer">Loan Officer</option>
                                    <option value="assistant">Assistant</option>
                                    <option value="consultant">Consultant</option>
                                </select>
                            </div>

                            <div class="col-md-4">
                                <label>Working Office :</label>
                                <select class="form-select">
                                    <option>Branch 1</option>
                                    <option>Branch 2</option>
                                </select>
                            </div>

                        </div>


                        <!-- TABS -->

                        <ul class="nav nav-tabs">

                            <li class="nav-item">
                                <a class="nav-link active" data-bs-toggle="tab" href="#basic">Basic Info</a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link" data-bs-toggle="tab" href="#salary">Salaries Detail</a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link" data-bs-toggle="tab" href="#signature">Signature</a>
                            </li>

                        </ul>


                        <div class="tab-content">

                            <!-- BASIC INFO TAB -->

                            <div class="tab-pane fade show active" id="basic">

                                <div class="row mt-3">

                                    <div class="col-md-9">

                                        <div class="row mb-2">

                                            <div class="col-md-2">Full Name :</div>

                                            <div class="col-md-2">
                                                <select class="form-select">
                                                    <option>Mr.</option>
                                                    <option>Mrs.</option>
                                                </select>
                                            </div>

                                            <div class="col-md-4">
                                                <input class="form-control" placeholder="First Name">
                                            </div>

                                            <div class="col-md-4">
                                                <input class="form-control" placeholder="Last Name">
                                            </div>

                                        </div>


                                        <div class="row mb-2">

                                            <div class="col-md-2">नाम :</div>

                                            <div class="col-md-2">
                                                <select class="form-select">
                                                    <option>श्रीमान</option>
                                                    <option>श्रीमती</option>
                                                </select>
                                            </div>

                                            <div class="col-md-4">
                                                <input class="form-control">
                                            </div>

                                            <div class="col-md-4">
                                                <input class="form-control">
                                            </div>

                                        </div>


                                        <div class="row mb-2">

                                            <div class="col-md-3">
                                                <label>Date of Birth</label>
                                                <input class="form-control">
                                            </div>

                                            <div class="col-md-3">
                                                <label>Gender</label>
                                                <select class="form-select">
                                                    <option>Male</option>
                                                    <option>Female</option>
                                                </select>
                                            </div>

                                            <div class="col-md-3">
                                                <label>Citizenship No</label>
                                                <input class="form-control">
                                            </div>

                                        </div>


                                        <div class="row mb-2">

                                            <div class="col-md-3">
                                                <label>Nationality</label>
                                                <select class="form-select">
                                                    <option>Nepali</option>
                                                </select>
                                            </div>

                                            <div class="col-md-3">
                                                <label>Zone</label>
                                                <select class="form-select"></select>
                                            </div>

                                            <div class="col-md-3">
                                                <label>District</label>
                                                <select class="form-select"></select>
                                            </div>

                                        </div>


                                        <div class="row mb-2">

                                            <div class="col-md-3">
                                                <label>Vdc/Mun</label>
                                                <select class="form-select"></select>
                                            </div>

                                            <div class="col-md-3">
                                                <label>Ward No</label>
                                                <input class="form-control">
                                            </div>

                                            <div class="col-md-3">
                                                <label>Tole</label>
                                                <input class="form-control">
                                            </div>

                                        </div>


                                        <div class="row mb-2">

                                            <div class="col-md-3">
                                                <label>Cast Group</label>
                                                <select class="form-select">
                                                    <option>Not Mentioned</option>
                                                </select>
                                            </div>

                                            <div class="col-md-3">
                                                <label>Occupation</label>
                                                <select class="form-select">
                                                    <option>Consultant</option>
                                                </select>
                                            </div>

                                            <div class="col-md-3">
                                                <label>Education</label>
                                                <select class="form-select">
                                                    <option>Not Mentioned</option>
                                                </select>
                                            </div>

                                        </div>


                                        <div class="row mb-2">

                                            <div class="col-md-3">
                                                <label>Phone No</label>
                                                <input class="form-control">
                                            </div>

                                            <div class="col-md-3">
                                                <label>Mobile No</label>
                                                <input class="form-control">
                                            </div>

                                            <div class="col-md-4">
                                                <label>Email</label>
                                                <input class="form-control">
                                            </div>

                                        </div>


                                        <div class="row mb-2">

                                            <div class="col-md-4">
                                                <label>Father Name</label>
                                                <input class="form-control">
                                            </div>

                                            <div class="col-md-2 mt-4">
                                                <input type="checkbox"> Enable
                                            </div>

                                        </div>

                                    </div>


                                    <!-- PHOTO -->

                                    <div class="col-md-3">
                                        <div class="photo-box"></div>
                                    </div>

                                </div>

                            </div>


                            <!-- SALARY TAB -->

                            <div class="tab-pane fade" id="salary">

                                <div class="mt-3">

                                    <div class="row mb-2">

                                        <div class="col-md-3">
                                            <label>Basic Salary</label>
                                            <input class="form-control">
                                        </div>

                                        <div class="col-md-3">
                                            <label>Allowance</label>
                                            <input class="form-control">
                                        </div>

                                        <div class="col-md-3">
                                            <label>PF</label>
                                            <input class="form-control">
                                        </div>

                                    </div>

                                </div>

                            </div>


                            <!-- SIGNATURE TAB -->

                            <div class="tab-pane fade" id="signature">

                                <div class="mt-3">

                                    <div class="row">

                                        <div class="col-md-4">
                                            <label>Upload Signature</label>
                                            <input type="file" class="form-control">
                                        </div>

                                        <div class="col-md-4">
                                            <label>Upload Photo</label>
                                            <input type="file" class="form-control">
                                        </div>

                                    </div>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
