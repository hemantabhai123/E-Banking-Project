<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <style>
        body {
            background: #b7c9e5;
            font-size: 13px;
        }

        .main-box {
            background: #d9e7fb;
            border: 1px solid #8fa7c9;
            padding: 10px;
        }

        .toolbar {
            background: #e7f0ff;
            border: 1px solid #9fb5d9;
            padding: 8px;
            margin-bottom: 10px;
        }

        .left-panel {
            background: #fff;
            border: 1px solid #9fb5d9;
            height: 580px;
        }

        .form-panel {
            background: #eaf2ff;
            border: 1px solid #9fb5d9;
            padding: 10px;
        }

        .tab-content {
            background: #eaf2ff;
            border: 1px solid #9fb5d9;
            padding: 10px;
        }

        input,
        select {
            height: 26px !important;
            font-size: 13px !important;
        }

        .photo-box {
            height: 150px;
            border: 1px solid #999;
            background: #fff;
        }
    </style>


    <div class="container-fluid mt-3">

        <div class="main-box">

            <!-- Toolbar -->

            <div class="toolbar">
                <button class="btn btn-light btn-sm">New</button>
                <button class="btn btn-primary btn-sm">Save</button>
                <button class="btn btn-secondary btn-sm">Cancel</button>
                <button class="btn btn-danger btn-sm">Delete</button>
                <button class="btn btn-info btn-sm">Print</button>
            </div>


            <div class="row">

                <!-- LEFT LIST -->

                <div class="col-md-3">

                    <div class="left-panel p-2">

                        <table class="table table-sm">
                            <thead>
                                <tr>
                                    <th>SN</th>
                                    <th>Account No.</th>
                                    <th>Name</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr class="table-warning">
                                    <td>1</td>
                                    <td>GS00001</td>
                                    <td>Ram Kumar Karki</td>
                                </tr>
                            </tbody>

                        </table>

                    </div>

                </div>


                <!-- RIGHT PANEL -->

                <div class="col-md-9">

                    <div class="form-panel">

                        <!-- FIRST ROW -->

                        <div class="row mb-2">

                            <div class="col-md-4">
                                <label>Deposit Scheme</label>
                                <select class="form-select">
                                    <option>General Saving (030.01)</option>
                                </select>
                            </div>

                            <div class="col-md-2">
                                <label>Account No</label>
                                <input class="form-control" value="GS00002">
                            </div>

                            <div class="col-md-2">
                                <label>Collector</label>
                                <select class="form-select">
                                    <option>Office</option>
                                </select>
                            </div>

                            <div class="col-md-2">
                                <label>Min Balance</label>
                                <input class="form-control" value="0.00">
                            </div>

                        </div>


                        <!-- SECOND ROW -->

                        <div class="row mb-2">

                            <div class="col-md-2">
                                <label>Int. Rate</label>
                                <input class="form-control" value="6.00">
                            </div>

                            <div class="col-md-2">
                                <label>ICM</label>
                                <select class="form-select">
                                    <option>Daily</option>
                                </select>
                            </div>

                            <div class="col-md-2">
                                <label>Deposit Period</label>
                                <input class="form-control" value="0">
                            </div>

                            <div class="col-md-2">
                                <label></label>
                                <select class="form-select">
                                    <option>Day</option>
                                    <option>Month</option>
                                    <option>Year</option>
                                </select>
                            </div>

                            <div class="col-md-2">
                                <label>Deposit Amt</label>
                                <input class="form-control" value="0.00">
                            </div>

                        </div>


                        <!-- THIRD ROW -->

                        <div class="row mb-2">

                            <div class="col-md-3">
                                <label>Start Date</label>
                                <input class="form-control" value="2073/04/01">
                            </div>

                            <div class="col-md-3">
                                <label>End Date</label>
                                <input class="form-control" value="2073/04/01">
                            </div>

                            <div class="col-md-3">
                                <label>Deposit Method</label>
                                <select class="form-select">
                                    <option></option>
                                </select>
                            </div>

                        </div>


                        <!-- FOURTH ROW -->

                        <div class="row mb-3">

                            <div class="col-md-4">
                                <label>Collect Interest On</label>
                                <select class="form-select">
                                    <option>Default</option>
                                </select>
                            </div>

                            <div class="col-md-4">
                                <label>AC No.</label>
                                <select class="form-select"></select>
                            </div>

                            <div class="col-md-4">
                                <label>Transfer Interest to</label>
                                <select class="form-select">
                                    <option>Quarter End</option>
                                </select>
                            </div>

                        </div>


                        <!-- MEMBER SELECT -->

                        <div class="row mb-3">

                            <div class="col-md-3">
                                <label>Group</label>
                                <select class="form-select">
                                    <option>ORDINARY</option>
                                </select>
                            </div>

                            <div class="col-md-5">
                                <label>Name</label>
                                <select class="form-select">
                                    <option>Ram Kumar Karki (MB00001)</option>
                                </select>
                            </div>

                        </div>


                        <!-- TABS -->

                        <ul class="nav nav-tabs">

                            <li class="nav-item">
                                <a class="nav-link active" data-bs-toggle="tab" href="#basic">Basic Info</a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link" data-bs-toggle="tab" href="#mandatory">Mandatory</a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link" data-bs-toggle="tab" href="#nominee">Nominee</a>
                            </li>

                        </ul>


                        <div class="tab-content">

                            <!-- BASIC INFO TAB -->

                            <div class="tab-pane fade show active" id="basic">

                                <div class="row mt-3">

                                    <div class="col-md-8">

                                        <div class="row mb-2">

                                            <div class="col-md-2">Full Name</div>

                                            <div class="col-md-2">
                                                <select class="form-select">
                                                    <option>Mr.</option>
                                                </select>
                                            </div>

                                            <div class="col-md-4">
                                                <input class="form-control">
                                            </div>

                                            <div class="col-md-4">
                                                <input class="form-control">
                                            </div>

                                        </div>


                                        <div class="row mb-2">

                                            <div class="col-md-3">
                                                <label>Gender</label>
                                                <select class="form-select">
                                                    <option>Male</option>
                                                    <option>Female</option>
                                                </select>
                                            </div>

                                            <div class="col-md-3">
                                                <label>Date of Birth</label>
                                                <input class="form-control">
                                            </div>

                                            <div class="col-md-3">
                                                <label>Citizenship No</label>
                                                <input class="form-control">
                                            </div>

                                        </div>


                                        <div class="row mb-2">

                                            <div class="col-md-3">
                                                <label>Nationality</label>
                                                <select class="form-select">
                                                    <option>Nepali</option>
                                                </select>
                                            </div>

                                            <div class="col-md-3">
                                                <label>District</label>
                                                <select class="form-select"></select>
                                            </div>

                                            <div class="col-md-3">
                                                <label>Vdc/Mun</label>
                                                <select class="form-select"></select>
                                            </div>

                                        </div>


                                        <div class="row mb-2">

                                            <div class="col-md-3">
                                                <label>Ward No</label>
                                                <input class="form-control">
                                            </div>

                                            <div class="col-md-3">
                                                <label>Street/Tole</label>
                                                <input class="form-control">
                                            </div>

                                            <div class="col-md-3">
                                                <label>Religion</label>
                                                <select class="form-select"></select>
                                            </div>

                                        </div>


                                        <div class="row mb-2">

                                            <div class="col-md-3">
                                                <label>Education</label>
                                                <select class="form-select"></select>
                                            </div>

                                            <div class="col-md-3">
                                                <label>Mobile No</label>
                                                <input class="form-control">
                                            </div>

                                            <div class="col-md-3">
                                                <label>Email</label>
                                                <input class="form-control">
                                            </div>

                                        </div>


                                        <div class="row mb-2">

                                            <div class="col-md-3">
                                                <label>Monthly Income</label>
                                                <input class="form-control">
                                            </div>

                                            <div class="col-md-3">
                                                <label>Occupation</label>
                                                <select class="form-select"></select>
                                            </div>

                                        </div>


                                    </div>


                                    <div class="col-md-4">

                                        <div class="photo-box"></div>

                                        <div class="mt-2">
                                            <label>Status</label>
                                            <input type="checkbox" checked> Enable
                                        </div>

                                    </div>

                                </div>

                            </div>


                            <!-- MANDATORY TAB -->

                            <div class="tab-pane fade" id="mandatory">

                                <div class="row mt-3">

                                    <div class="col-md-4">
                                        <label>Citizenship Issue Date</label>
                                        <input class="form-control">
                                    </div>

                                    <div class="col-md-4">
                                        <label>Issue District</label>
                                        <select class="form-select"></select>
                                    </div>

                                </div>

                            </div>


                            <!-- NOMINEE TAB -->

                            <div class="tab-pane fade" id="nominee">

                                <div class="row mt-3">

                                    <div class="col-md-4">
                                        <label>First Priority</label>
                                        <select class="form-select">
                                            <option>Not Mentioned</option>
                                        </select>
                                    </div>

                                    <div class="col-md-4">
                                        <label>Second Priority</label>
                                        <select class="form-select">
                                            <option>Not Mentioned</option>
                                        </select>
                                    </div>

                                    <div class="col-md-4">
                                        <label>Third Priority</label>
                                        <select class="form-select">
                                            <option>Not Mentioned</option>
                                        </select>
                                    </div>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
