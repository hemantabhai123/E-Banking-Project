<!DOCTYPE html>
<html>
<head>
    <title>Loan Scheme</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .section-box {
            border: 1px solid #dcdcdc;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            background: #f9fbff;
        }
        .section-title {
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 16px;
        }
        .small-input {
            height: 32px;
            font-size: 14px;
        }
    </style>
</head>
<body class="bg-light">

<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Loan Scheme</h5>
        </div>

        <div class="card-body">

            <form method="POST">
                <!-- Basic Information -->
                <div class="section-box">
                    <div class="section-title">Basic Information</div>

                    <div class="row mb-3">
                        <div class="col-md-3">
                            <label>A/C No.</label>
                            <input type="text" name="account_no" class="form-control small-input">
                        </div>

                        <div class="col-md-4">
                            <label>Loan Scheme</label>
                            <input type="text" name="loan_scheme" class="form-control small-input">
                        </div>

                        <div class="col-md-2">
                            <label>Status</label><br>
                            <input type="checkbox" name="status" checked> Enable
                        </div>

                        <div class="col-md-3">
                            <label>Loan Name (Nepali)</label>
                            <input type="text" name="loan_name_np" class="form-control small-input">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-2">
                            <label>Prefix</label>
                            <input type="text" name="prefix" class="form-control small-input">
                        </div>

                        <div class="col-md-1">
                            <label>Length</label>
                            <input type="number" name="length" class="form-control small-input">
                        </div>

                        <div class="col-md-3">
                            <label>Calculation</label>
                            <select name="calculation" class="form-select small-input">
                                <option value="EMI">EMI</option>
                                <option value="Flat">Flat</option>
                            </select>
                        </div>

                        <div class="col-md-3">
                            <label>Frequency</label>
                            <select name="frequency" class="form-select small-input">
                                <option>Monthly</option>
                                <option>Quarterly</option>
                                <option>Yearly</option>
                            </select>
                        </div>

                        <div class="col-md-3">
                            <label>Interest Rate (%)</label>
                            <input type="number" step="0.01" name="interest_rate" class="form-control small-input">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-3">
                            <label>Service Charge (%)</label>
                            <input type="number" step="0.01" name="service_charge" class="form-control small-input">
                        </div>

                        <div class="col-md-1 mt-4">
                            <input type="checkbox" name="service_amt"> AMT
                        </div>

                        <div class="col-md-3">
                            <label>Collector Commission (%)</label>
                            <input type="number" step="0.01" name="collector_commission" class="form-control small-input">
                        </div>

                        <div class="col-md-1 mt-4">
                            <input type="checkbox" name="collector_amt"> AMT
                        </div>

                        <div class="col-md-3">
                            <label>Rebate System (%)</label>
                            <input type="number" step="0.01" name="rebate" class="form-control small-input">
                        </div>
                    </div>
                </div>

                <!-- Fine / Penalty Setting -->
                <div class="section-box">
                    <div class="section-title">Fine / Penalty System Setting</div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label>Fine/Penalty Type</label>
                            <select name="penalty_type" class="form-select small-input">
                                <option>Schedule Wise</option>
                                <option>Fixed</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label>Charge On</label>
                            <select name="charge_on" class="form-select small-input">
                                <option>Due Installment</option>
                                <option>Total Due</option>
                            </select>
                        </div>

                        <div class="col-md-2">
                            <label>Direct Fine (%)</label>
                            <input type="number" step="0.01" name="direct_fine" class="form-control small-input">
                        </div>

                        <div class="col-md-2 mt-4">
                            <input type="checkbox" name="direct_amt"> AMT
                        </div>
                    </div>
                </div>

                <!-- Fine / Penalty Calendar -->
                <div class="section-box">
                    <div class="section-title">Fine / Penalty System Calendar</div>

                    <div class="row mb-2">
                        <div class="col-md-3">
                            <label>Below 30 Days (%)</label>
                            <input type="number" step="0.01" name="below_30" class="form-control small-input">
                        </div>

                        <div class="col-md-3">
                            <label>31 to 60 Days (%)</label>
                            <input type="number" step="0.01" name="days_31_60" class="form-control small-input">
                        </div>

                        <div class="col-md-3">
                            <label>61 to 90 Days (%)</label>
                            <input type="number" step="0.01" name="days_61_90" class="form-control small-input">
                        </div>

                        <div class="col-md-3">
                            <label>91 to 120 Days (%)</label>
                            <input type="number" step="0.01" name="days_91_120" class="form-control small-input">
                        </div>
                    </div>

                    <div class="row mb-2">
                        <div class="col-md-3">
                            <label>121 to 150 Days (%)</label>
                            <input type="number" step="0.01" name="days_121_150" class="form-control small-input">
                        </div>

                        <div class="col-md-3">
                            <label>151 to 180 Days (%)</label>
                            <input type="number" step="0.01" name="days_151_180" class="form-control small-input">
                        </div>

                        <div class="col-md-3">
                            <label>181 to 365 Days (%)</label>
                            <input type="number" step="0.01" name="days_181_365" class="form-control small-input">
                        </div>

                        <div class="col-md-3">
                            <label>Above 365 Days (%)</label>
                            <input type="number" step="0.01" name="above_365" class="form-control small-input">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-3">
                            <label>Grace Period (Days)</label>
                            <input type="number" name="grace_period" class="form-control small-input">
                        </div>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="text-end">
                    <button type="submit" class="btn btn-success">Save</button>
                    <button type="reset" class="btn btn-secondary">Cancel</button>
                    <button type="button" class="btn btn-danger">Delete</button>
                </div>

            </form>
        </div>
    </div>
</div>

</body>
</html>
