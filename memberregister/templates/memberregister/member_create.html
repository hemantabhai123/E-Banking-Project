{% extends 'backenddashboard/base.html' %}
{% load static %}
{% block style %}
{% endblock %}
{% block content %}
<div class="mx-n4 px-4 mx-lg-n6 px-lg-6 bg-body-emphasis pt-6 pb-9 border-top">
    <!-- HEADER -->
    <div class="card-header fw-bold">
        Member Registration Form
    </div>
    <!-- TOOLBAR -->
    <div class="card-body border-bottom">
        <div class="btn-group btn-group-sm">
            <button class="btn btn-outline-primary">New</button>
            <button class="btn btn-outline-success">Save</button>
            <button class="btn btn-outline-secondary">Cancel</button>
            <button class="btn btn-outline-danger" disabled>Delete</button>
            <button class="btn btn-outline-dark" disabled>Print</button>
        </div>
    </div>
    <div class="row g-0">
        <!-- LEFT PANEL -->
        <div class="col-md-3 border-end">
            <div class="p-2">
                <table class="table table-sm table-bordered text-center">
                    <thead class="table-light">
                        <tr>
                            <th>Mem. No.</th>
                            <th>Name</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>MB00001</td>
                            <td>Ram Kumar</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <!-- RIGHT PANEL -->
        <div class="col-md-9">
            <div class="p-3">
                <form>
                    <!-- TOP SECTION -->
                    <div class="row">
                        <div class="col-md-6">
                            <div class="row mb-2 align-items-center">
                                <label class="col-4 col-form-label text-end">Member ID</label>
                                <div class="col-8">
                                    <input type="text" class="form-control form-control-sm" value="MB00001" readonly>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="row mb-2 align-items-center">
                                <label class="col-4 col-form-label text-end">Join Date</label>
                                <div class="col-8">
                                    <input type="date" class="form-control form-control-sm">
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="row mb-2 align-items-center">
                                <label class="col-4 col-form-label text-end">Member Type</label>
                                <div class="col-8">
                                    <select class="form-select form-select-sm select2">
                                        <option>Ordinary</option>
                                        <option>Shareholder</option>
                                        <option>Staff</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- TABS -->
                    <ul class="nav nav-tabs mt-4">
                        <li class="nav-item">
                            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#basicInfo">
                                Basic Info
                            </button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#mandatoryInfo">
                                Mandatory
                            </button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#nomineeInfo">
                                Nominee
                            </button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#signatureInfo">
                                Signature
                            </button>
                        </li>
                    </ul>

                    <div class="tab-content border border-top-0 p-3">
                        <!-- BASIC INFO -->
                        <div class="tab-pane fade show active" id="basicInfo">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="row mb-2 align-items-center">
                                        <label class="col-4 col-form-label text-end">Title</label>
                                        <div class="col-8">
                                            <select class="form-select form-select-sm select2">
                                                <option>Mr.</option>
                                                <option>Mrs.</option>
                                                <option>Miss</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="row mb-2 align-items-center">
                                        <label class="col-4 col-form-label text-end">First Name</label>
                                        <div class="col-8">
                                            <input type="text" class="form-control form-control-sm" required>
                                        </div>
                                    </div>
                                    <div class="row mb-2 align-items-center">
                                        <label class="col-4 col-form-label text-end">Last Name</label>
                                        <div class="col-8">
                                            <input type="text" class="form-control form-control-sm" required>
                                        </div>
                                    </div>
                                    <div class="row mb-2 align-items-center">
                                        <label class="col-4 col-form-label text-end">Gender</label>
                                        <div class="col-8">
                                            <select class="form-select form-select-sm">
                                                <option>Male</option>
                                                <option>Female</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="row mb-2 align-items-center">
                                        <label class="col-4 col-form-label text-end">Date of Birth</label>
                                        <div class="col-8">
                                            <input type="date" class="form-control form-control-sm">
                                        </div>
                                    </div>
                                    <div class="row mb-2 align-items-center">
                                        <label class="col-4 col-form-label text-end">Mobile</label>
                                        <div class="col-8">
                                            <input type="text" class="form-control form-control-sm">
                                        </div>
                                    </div>
                                    <div class="row mb-2 align-items-center">
                                        <label class="col-4 col-form-label text-end">Email</label>
                                        <div class="col-8">
                                            <input type="email" class="form-control form-control-sm">
                                        </div>
                                    </div>

                                    <div class="row mb-2 align-items-center">
                                        <label class="col-4 col-form-label text-end">Address</label>
                                        <div class="col-8">
                                            <input type="text" class="form-control form-control-sm">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- MANDATORY -->
                        <div class="tab-pane fade" id="mandatoryInfo">

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="row mb-2 align-items-center">
                                        <label class="col-4 col-form-label text-end">Citizenship No</label>
                                        <div class="col-8">
                                            <input type="text" class="form-control form-control-sm">
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="row mb-2 align-items-center">
                                        <label class="col-4 col-form-label text-end">Issued District</label>
                                        <div class="col-8">
                                            <input type="text" class="form-control form-control-sm">
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="row mb-2 align-items-center">
                                        <label class="col-4 col-form-label text-end">PAN No</label>
                                        <div class="col-8">
                                            <input type="text" class="form-control form-control-sm">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- NOMINEE -->
                        <div class="tab-pane fade" id="nomineeInfo">

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="row mb-2 align-items-center">
                                        <label class="col-4 col-form-label text-end">Nominee Name</label>
                                        <div class="col-8">
                                            <input type="text" class="form-control form-control-sm">
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="row mb-2 align-items-center">
                                        <label class="col-4 col-form-label text-end">Relation</label>
                                        <div class="col-8">
                                            <input type="text" class="form-control form-control-sm">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- SIGNATURE -->
                        <div class="tab-pane fade" id="signatureInfo">

                            <div class="row text-center">

                                <div class="col-md-6">
                                    <p class="fw-bold">Photo</p>
                                    <div class="ratio ratio-1x1 border mb-2"></div>
                                    <input type="file" class="form-control form-control-sm">
                                </div>

                                <div class="col-md-6">
                                    <p class="fw-bold">Signature</p>
                                    <div class="ratio ratio-1x1 border mb-2"></div>
                                    <input type="file" class="form-control form-control-sm">
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- FOOTER BUTTONS -->
                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-success btn-sm">Save Member</button>
                        <button type="reset" class="btn btn-secondary btn-sm">Reset</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script>
    $('.select2').select2({
        theme: 'bootstrap-5',
        width: '100%'
    });
</script>
{% endblock %}
