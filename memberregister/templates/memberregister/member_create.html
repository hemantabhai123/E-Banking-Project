<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Member Information Form</title>

<style>
body {
    margin: 0;
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    background: #cfe1f9;
}

/* Window */
.window {
    width: 1400px;
    margin: 10px auto;
    border: 1px solid #8aa9d6;
    background: #dbe9fb;
}

/* Toolbar */
.toolbar {
    padding: 8px;
    background: linear-gradient(#eaf3ff, #c9dcf7);
    border-bottom: 1px solid #8aa9d6;
}

.toolbar button {
    padding: 6px 16px;
    margin-right: 6px;
    border: 1px solid #8aa9d6;
    background: #f4f8ff;
    cursor: pointer;
}

.toolbar button:hover {
    background: #e1efff;
}

/* Layout */
.container {
    display: flex;
}

/* Left Panel */
.left-panel {
    width: 300px;
    border-right: 1px solid #8aa9d6;
    background: #eef5ff;
    padding: 10px;
}

.left-panel input {
    width: 100%;
    padding: 4px;
}

/* Right Panel */
.right-panel {
    flex: 1;
    padding: 10px;
}

/* Form Rows */
.row {
    display: flex;
    margin-bottom: 6px;
}

.row label {
    width: 120px;
    font-size: 13px;
}

.row input, .row select {
    width: 200px;
    padding: 4px;
    margin-right: 20px;
}

/* Tabs */
.tabs {
    display: flex;
    border-bottom: 1px solid #8aa9d6;
    margin-top: 10px;
}

.tab {
    padding: 6px 15px;
    background: #e8f1ff;
    border: 1px solid #8aa9d6;
    border-bottom: none;
    cursor: pointer;
}

.tab.active {
    background: #ffffff;
    font-weight: bold;
}

.tab-content {
    display: none;
    padding: 10px;
    background: #ffffff;
    border: 1px solid #8aa9d6;
}

.tab-content.active {
    display: block;
}

/* Checkbox Section */
.checkbox-group {
    margin-top: 10px;
}

.checkbox-group label {
    display: block;
    margin-bottom: 5px;
}

/* Genealogy Table */
.genealogy {
    margin-top: 10px;
}

.genealogy input {
    width: 180px;
    margin-right: 10px;
}
</style>
</head>

<body>

<div class="window">
    <!-- Toolbar -->
    <div class="toolbar">
        <button onclick="newForm()">New</button>
        <button>Save</button>
        <button>Cancel</button>
        <button disabled>Delete</button>
        <button disabled>Print</button>
    </div>

    <div class="container">
        <!-- Left Panel -->
        <div class="left-panel">
            <strong>Mem. No.</strong><br>
            <input placeholder="Contains...">
            <br><br>
            <strong>Name</strong><br>
            <input placeholder="Contains...">
        </div>

        <!-- Right Panel -->
        <div class="right-panel">

            <!-- Top Fields -->
            <div class="row">
                <label>Alias</label>
                <input value="MB00001">
                <label>Type</label>
                <select><option>ORDINARY</option></select>
                <label>Join Date</label>
                <input type="date">
                <label>Trans. Date</label>
                <input type="date">
            </div>

            <div class="row">
                <label>Name</label>
                <select><option>Mr.</option></select>
                <input style="width:400px;">
            </div>

            <!-- Tabs -->
            <div class="tabs">
                <div class="tab active" onclick="openTab('basic')">Basic Info</div>
                <div class="tab" onclick="openTab('mandatory')">Mandatory</div>
                <div class="tab" onclick="openTab('nominee')">Nominee</div>
                <div class="tab" onclick="openTab('signature')">Signature</div>
            </div>

            <!-- Basic Info -->
            <div id="basic" class="tab-content active">
                <div class="row">
                    <label>Gender</label>
                    <select><option>Male</option></select>
                    <label>Date of Birth</label>
                    <input type="date">
                </div>

                <div class="row">
                    <label>Citizenship No</label>
                    <input>
                    <label>Issued Date</label>
                    <input type="date">
                </div>

                <div class="row">
                    <label>District</label>
                    <select></select>
                    <label>Monthly Income</label>
                    <input value="0.00">
                </div>

                <div class="row">
                    <label>Mobile No</label>
                    <input value="0">
                    <label>Email</label>
                    <input>
                </div>

                <div class="checkbox-group">
                    <label><input type="checkbox" checked> Enable</label>
                    <label><input type="checkbox"> SMS Banking</label>
                    <label><input type="checkbox"> Mobile Banking</label>
                    <label><input type="checkbox"> Mobile Reporting</label>
                </div>

                <!-- Genealogy -->
                <div class="genealogy">
                    <strong>Genealogy Info</strong><br><br>
                    <input placeholder="Relation">
                    <input placeholder="Name Surname">
                    <input placeholder="नाम थर">
                </div>
            </div>

            <!-- Other Tabs -->
            <div id="mandatory" class="tab-content">Mandatory Info</div>
            <div id="nominee" class="tab-content">Nominee Info</div>
            <div id="signature" class="tab-content">Signature Upload</div>

        </div>
    </div>
</div>

<script>
function openTab(tabId) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

    event.target.classList.add('active');
    document.getElementById(tabId).classList.add('active');
}

function newForm() {
    document.querySelectorAll('input').forEach(i => i.value = '');
    document.querySelectorAll('select').forEach(s => s.selectedIndex = 0);
}
</script>

</body>
</html>
